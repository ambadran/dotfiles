set-option -g default-terminal 'screen-254color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g mouse on
# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind n new-window
bind ^D detach
bind * list-clients

bind T previous-window
bind t next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.tmux.conf
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
# bind ^L refresh-client
bind l refresh-client
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 10
bind -r -T prefix . resize-pane -R 10
bind -r -T prefix - resize-pane -D 2
bind -r -T prefix = resize-pane -U 2
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
# bind c kill-pane
bind x swap-pane -D
bind ^h swap-window -t -1\; select-window -t -1
bind ^l swap-window -t +1\; select-window -t +1
bind S choose-session
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -n C-n display-popup -E nvim -c ":ObsidianNew"
bind-key -n C-q display-popup -w "90%" -h "85%" -E nvim -c ":ObsidianSearch"



set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# fixing stupid tmux-yank
set -g set-clipboard on
set -g @override_copy_command 'xclip -i -sel p -f | xclip -i -sel c'
set -g @yank_selection 'clipboard'
set-option -sa terminal-features ',*:clipboard'
# so I just rm -rf ./tmux/plugins/tmux-yank, then re-installed, then it just worked !

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-strategy-vim 'session'
# set -g @catppuccin_window_left_separator ""
# set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
# set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory meetings date_time"
set -g @catppuccin_status_modules_left "session"
# set -g @catppuccin_status_left_separator  " "
# set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
# set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"

run -b '~/.tmux/plugins/tpm/tpm'

# =====================================================================
# UNIVERSAL AI AGENT WORKFLOW v2.0
# =====================================================================

# --- 1. THE AGENT RACK ---
# to set the name of the agent use:
# `Prefix + :set -p @agent_id <agent_name>`
# SUMMON (Prefix + Shift-A): Brings an agent from the rack to current window.
bind A command-prompt -p "Summon Agent:" "join-pane -h -l 40% -s 'et-agents:%%'"

# SMART BANISH (Prefix + c): Sends agent back to rack if it has a tattoo.
# If it's a normal pane, it just kills it.
bind c if-shell -F "#{!=:#{@agent_id},}" \
    "run-shell 'tmux break-pane -d -n #{@agent_id} && sleep 0.1 && tmux move-window -s #{@agent_id} -t et-agents:'" \
    "kill-pane"

# --- 2. UNIVERSAL PROMPT MACRO ---
# EXECUTE PROMPT (Prefix + P):
# 1. Prompts you for a key (e.g., 'db-init').
# 2. Reads the corresponding file from the CURRENT project's .agent/prompts/ folder.
# 3. Types it instantly into the active Gemini pane.
# =====================================================================
# UNIVERSAL PROMPT MACRO (Native Tmux Version)
# =====================================================================
# Directly loads the file into the paste buffer using native Tmux expansion,
# bypassing potential shell piping issues.
bind P command-prompt -p "Run Prompt:" \
    "load-buffer '#{pane_current_path}/.agent/prompt/%%'; paste-buffer -d"


