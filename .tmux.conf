# ==============================================================================
# 1. Base Environment & Colors
# ==============================================================================

# Enable True Color (24-bit) support for Neovim and Alacritty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

# Enable native clipboard passthrough (CRITICAL for Neovim OSC 52 integration)
set -g set-clipboard on

# Enable mouse support for resizing panes and scrolling
set -g mouse on

# ==============================================================================
# 2. Prefix Key Configuration
# ==============================================================================

# Change prefix from default (Ctrl-B) to Ctrl-A
unbind C-b
set -g prefix ^A
# Press Ctrl-A twice to send a literal Ctrl-A to the underlying application
bind ^A send-prefix 

# ==============================================================================
# 3. Core Keybindings
# ==============================================================================

# Reload configuration on the fly
bind R source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Window Management
bind n new-window
bind T previous-window
bind t next-window
bind r command-prompt "rename-window %%"
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind '"' choose-window
bind ^h swap-window -t -1\; select-window -t -1
bind ^l swap-window -t +1\; select-window -t +1

# Pane Splitting (Retaining current path)
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane Navigation (Vim style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane Resizing
bind -r -T prefix , resize-pane -L 10
bind -r -T prefix . resize-pane -R 10
bind -r -T prefix - resize-pane -D 2
bind -r -T prefix = resize-pane -U 2
bind z resize-pane -Z

# Pane Management
bind x swap-pane -D
bind P set pane-border-status
bind * setw synchronize-panes # (Removed list-clients conflict)

# Session Management
bind S choose-session
bind ^D detach
bind ^X lock-server
bind : command-prompt

# ==============================================================================
# 4. Copy Mode & Integration
# ==============================================================================

# Enable Vim keybindings in copy mode (Required for 'v' and 'y' mappings)
set-window-option -g mode-keys vi

# Start visual selection with 'v' (Vim style)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Yank (copy) selection with 'y' (Vim style)
# Because we enabled 'set-clipboard on', this natively sends data via OSC 52
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# (Optional) Allow copying simply by highlighting with the mouse and dragging
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ==============================================================================
# 5. TPM Plugins & Theme (Catppuccin)
# ==============================================================================

# Core Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# ------------------------------------------------------------------------------
# Resurrect & Continuum Configuration
# ------------------------------------------------------------------------------
set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.tmux/resurrect'

# CRITICAL: Tell Resurrect to restore Neovim sessions, not legacy Vim
set -g @resurrect-strategy-nvim 'session'

# ------------------------------------------------------------------------------
# Catppuccin Theme Configuration
# ------------------------------------------------------------------------------
set -g status-position top
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"

## Set status bar modules (Removed 'meetings' since the cal.sh script is disabled)
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"

set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# ------------------------------------------------------------------------------
# Initialize TMUX plugin manager (Keep this line at the very bottom of tmux.conf)
# ------------------------------------------------------------------------------
run -b '~/.tmux/plugins/tpm/tpm'

# =====================================================================
# UNIVERSAL AI AGENT WORKFLOW v2.0
# =====================================================================

# --- 1. THE AGENT RACK ---
# to set the name of the agent use:
# `Prefix + :set -p @agent_id <agent_name>`
# SUMMON (Prefix + Shift-A): Brings an agent from the rack to current window.
bind A command-prompt -p "Summon Agent:" "join-pane -h -l 40% -s 'et-agents:%%'"

# SMART BANISH (Prefix + c): Sends agent back to rack if it has a tattoo.
# If it's a normal pane, it just kills it.
bind c if-shell -F "#{!=:#{@agent_id},}" \
    "run-shell 'tmux break-pane -d -n #{@agent_id} && sleep 0.1 && tmux move-window -s #{@agent_id} -t et-agents:'" \
    "kill-pane"

# --- 2. UNIVERSAL PROMPT MACRO ---
# EXECUTE PROMPT (Prefix + P):
# 1. Prompts you for a key (e.g., 'db-init').
# 2. Reads the corresponding file from the CURRENT project's .agent/prompts/ folder.
# 3. Types it instantly into the active Gemini pane.
# =====================================================================
# UNIVERSAL PROMPT MACRO (Native Tmux Version)
# =====================================================================
# Directly loads the file into the paste buffer using native Tmux expansion,
# bypassing potential shell piping issues.
bind P command-prompt -p "Run Prompt:" \
    "load-buffer '#{pane_current_path}/.agent/prompt/%%'; paste-buffer -d"


